<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Offline — C-CURE Physiotherapy & Rehab Clinic</title>
  <link rel="icon" href="/mobile-logo.png">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --card-border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #0ea5e9;
      --amber: #f59e0b;
      --emerald: #10b981;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --card-bg: rgba(255, 255, 255, 0.9);
        --card-border: rgba(0, 0, 0, 0.08);
        --text: #0f172a;
        --muted: #64748b;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      position: relative;
      overflow: hidden;
    }
    .glow-1 {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      width: 20rem;
      height: 20rem;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.15) 0%, transparent 70%);
      pointer-events: none;
    }
    .glow-2 {
      position: absolute;
      bottom: 10%;
      right: 10%;
      width: 15rem;
      height: 15rem;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1.5rem;
      padding: 2rem 1.5rem;
      width: 100%;
      max-width: 26rem;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      position: relative;
      z-index: 10;
      animation: popIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.94) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .logo-container {
      position: relative;
      display: inline-block;
      margin-bottom: 1.25rem;
    }
    .logo-badge {
      width: 5rem;
      height: 5rem;
      border-radius: 1.25rem;
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.2), rgba(14, 165, 233, 0.05));
      border: 1px solid rgba(14, 165, 233, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
    }
    .logo-img {
      width: 3.5rem;
      height: 3.5rem;
      object-fit: contain;
    }
    .icon-badge {
      position: absolute;
      bottom: -0.35rem;
      right: -0.35rem;
      width: 2rem;
      height: 2rem;
      border-radius: 0.75rem;
      background: var(--amber);
      color: #78350f;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--card-bg);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
    }
    p.desc {
      font-size: 0.875rem;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .status-box {
      background: rgba(148, 163, 184, 0.08);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      padding: 1rem;
      text-align: left;
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      font-size: 0.8125rem;
      color: var(--muted);
    }
    .status-item {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      line-height: 1.4;
    }
    .status-dot {
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 50%;
      margin-top: 0.35rem;
      flex-shrink: 0;
    }
    .dot-amber { background: var(--amber); }
    .dot-emerald { background: var(--emerald); }
    .btn-retry {
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 0.875rem;
      padding: 0.875rem 1rem;
      font-size: 0.9375rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: transform 0.15s ease, opacity 0.15s ease;
      box-shadow: 0 8px 20px rgba(14, 165, 233, 0.3);
    }
    .btn-retry:active {
      transform: scale(0.97);
      opacity: 0.9;
    }
    .clinic-footer {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 1.25rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <div class="card">
    <div class="logo-container">
      <div class="logo-badge">
        <img src="/mobile-logo.png" alt="C-CURE Clinic" class="logo-img" onerror="this.style.display='none'">
      </div>
      <div class="icon-badge">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
    </div>

    <h1>You're Currently Offline</h1>
    <p class="desc">No active internet connection found on this device. Reconnect to access clinic records.</p>

    <div class="status-box">
      <div class="status-item">
        <span class="status-dot dot-amber"></span>
        <span>Check your <strong>Wi-Fi</strong> router or <strong>Mobile Data</strong> switch.</span>
      </div>
      <div class="status-item">
        <span class="status-dot dot-emerald"></span>
        <span>Auto-reload will trigger as soon as your connection restores.</span>
      </div>
    </div>

    <button id="retryBtn" class="btn-retry" onclick="handleRetry()">
      <svg id="retryIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
        <path d="M21 3v5h-5"></path>
        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
        <path d="M8 16H3v5"></path>
      </svg>
      <span id="retryText">Retry Connection</span>
    </button>

    <p class="clinic-footer">C-CURE Physiotherapy &amp; Rehab Clinic</p>
  </div>

  <script>
    function handleRetry() {
      var btn = document.getElementById('retryBtn');
      var text = document.getElementById('retryText');
      text.innerText = 'Checking Connection...';
      btn.style.opacity = '0.8';
      setTimeout(function() {
        window.location.reload();
      }, 400);
    }

    // Auto-reload when internet connection comes back online
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
